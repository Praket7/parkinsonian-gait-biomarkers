name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-lock.txt pytest
      - run: python -m pip install -e . --no-deps
      - run: PYTHONPATH=. pytest -q
      # Release-integrity checks require a complete frozen bundle and therefore
      # run on the public release branch, not intermediate protocol-freeze refs.
      - if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: python scripts/qa_release_gate.py
      - if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_analysis_freeze.py
      # Licensed research files stay in controlled storage, never CI.
      - run: python -m src.run_pipeline --config configs/analysis.yaml
