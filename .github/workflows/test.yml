name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest
      - run: PYTHONPATH=. pytest -q
      - run: python scripts/qa_release_gate.py
      # Licensed research files stay in controlled storage, never CI.
      - run: python -m src.run_pipeline --config configs/analysis.yaml
