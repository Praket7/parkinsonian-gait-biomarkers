[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parkinsonian-gait-biomarkers"
version = "0.1.0"
description = "Context-aware Parkinsonian gait biomarker analysis"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "PyYAML>=6", "scipy>=1.11", "statsmodels>=0.14", "matplotlib>=3.8", "scikit-learn>=1.7"]

[tool.setuptools]
packages = ["src"]
