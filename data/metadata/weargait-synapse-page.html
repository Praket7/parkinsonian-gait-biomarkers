          <h1>
            Synapse — A Collaborative Platform for Open Biomedical Science
          </h1>
          <p>
            <strong>Synapse</strong> is a collaborative data-sharing and
            analysis platform built and operated by
            <strong>Sage Bionetworks</strong>, a 501(c)(3) nonprofit biomedical
            research organization based in Seattle, Washington.
          </p>

          <h2>About Sage Bionetworks</h2>
          <p>
            Sage Bionetworks is a nonprofit research organization whose mission
            is
            <em
              >to drive a new age of discovery through truly open science and
              radical collaboration.</em
            >
          </p>
          <p>
            Our vision is
            <em
              >to create a world where silos within and across science and
              technology no longer exist, forging a path to optimal human
              health.</em
            >
          </p>
          <p>
            We are a trusted leader in data sharing and reuse, enabling a rapid
            acceleration in biomedical discoveries and the transformation of
            medicine. <em>Better Science Together</em> is the principle that
            guides our work with researchers, clinicians, patient communities,
            and funders worldwide.
          </p>

          <h2>What Synapse Does</h2>
          <p>
            Synapse is the platform Sage Bionetworks uses to make biomedical
            research data findable, accessible, interoperable, and reusable
            (FAIR). Researchers, clinicians, and data scientists use Synapse to:
          </p>
          <ul>
            <li>
              Share large biomedical datasets across institutions, with
              appropriate access controls, data-use agreements, and governance.
            </li>
            <li>
              Run reproducible analyses on shared data with documented
              provenance.
            </li>
            <li>
              Coordinate consortium science across disease areas including
              Alzheimer's disease, neurofibromatosis, ALS, rare cancers, and
              others.
            </li>
            <li>
              Power public-facing knowledge portals such as the AD Knowledge
              Portal, the NF Data Portal, and the ALS Knowledge Portal.
            </li>
          </ul>
